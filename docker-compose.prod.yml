services:
  db:
    container_name: fitapp-postgres

  backend:
    container_name: fitapp-backend

  frontend:
    container_name: fitapp-frontend

  caddy:
    image: caddy:2
    container_name: fitapp-caddy
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
