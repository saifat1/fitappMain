databaseChangeLog:
  - changeSet:
      id: 041-create-device-push-token
      author: claude
      changes:
        # FIT-69: Firebase Cloud Messaging tokens of the store app (Android / iOS), one row per device.
        # Web Push (browser / PWA) keeps using push_subscription.
        - createTable:
            tableName: device_push_token
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_device_push_token
                    nullable: false

              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: token
                  type: varchar(4096)
                  constraints:
                    nullable: false

              - column:
                  name: platform
                  type: varchar(16)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: device_push_token
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_device_push_token_user
            onDelete: CASCADE

        # A token belongs to one device; when another user signs in on it, the row is re-assigned.
        - addUniqueConstraint:
            tableName: device_push_token
            columnNames: token
            constraintName: uk_device_push_token_token

        - createIndex:
            tableName: device_push_token
            indexName: idx_device_push_token_user
            columns:
              - column:
                  name: user_id
