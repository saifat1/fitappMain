databaseChangeLog:
  - changeSet:
      id: 035-create-training-exercise-set
      author: claude
      changes:
        - createTable:
            tableName: training_exercise_set
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_training_exercise_set
                    nullable: false

              - column:
                  name: training_exercise_id
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: set_number
                  type: int
                  constraints:
                    nullable: false

              - column:
                  name: reps
                  type: int

              - column:
                  name: weight
                  type: numeric(10,2)

        - addForeignKeyConstraint:
            baseTableName: training_exercise_set
            baseColumnNames: training_exercise_id
            referencedTableName: training_exercise
            referencedColumnNames: id
            constraintName: fk_training_exercise_set_exercise
            onDelete: CASCADE

        - addUniqueConstraint:
            tableName: training_exercise_set
            columnNames: training_exercise_id, set_number
            constraintName: uk_training_exercise_set_number
