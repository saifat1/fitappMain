databaseChangeLog:
  - changeSet:
      id: 002-create-invite
      author: ivan
      changes:
        - createTable:
            tableName: invite
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_invite
                    nullable: false

              - column:
                  name: token
                  type: varchar(255)
                  constraints:
                    nullable: false

              - column:
                  name: trainer_id
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: varchar(255)

              - column:
                  name: expires_at
                  type: timestamp
                  constraints:
                    nullable: false

              - column:
                  name: used_at
                  type: timestamp

              - column:
                  name: status
                  type: varchar(50)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: invite
            columnNames: token
            constraintName: uk_invite_token

        - addForeignKeyConstraint:
            baseTableName: invite
            baseColumnNames: trainer_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_invite_trainer
            onDelete: RESTRICT