databaseChangeLog:
  - changeSet:
      id: 042-create-feedback
      author: claude
      changes:
        # FIT-73: ideas and problem reports from trainers and clients («Предложить идею / Сообщить о проблеме»).
        - createTable:
            tableName: feedback
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_feedback
                    nullable: false

              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false

              # IDEA, BUG, OTHER
              - column:
                  name: type
                  type: varchar(16)
                  constraints:
                    nullable: false

              - column:
                  name: text
                  type: varchar(4000)
                  constraints:
                    nullable: false

              # NEW, ACCEPTED, PLANNED, DONE, DECLINED
              - column:
                  name: status
                  type: varchar(16)
                  constraints:
                    nullable: false

              # WEB or ANDROID / IOS (store app)
              - column:
                  name: platform
                  type: varchar(16)
                  constraints:
                    nullable: false

              - column:
                  name: screen
                  type: varchar(200)

              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: feedback
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_feedback_user
            onDelete: CASCADE

        - createIndex:
            tableName: feedback
            indexName: idx_feedback_user
            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: feedback
            indexName: idx_feedback_status_created
            columns:
              - column:
                  name: status
              - column:
                  name: created_at
