databaseChangeLog:
  - changeSet:
      id: 003-create-trainer-client
      author: ivan
      changes:
        - createTable:
            tableName: trainer_client
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_trainer_client
                    nullable: false

              - column:
                  name: trainer_id
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: client_id
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: trainer_client
            baseColumnNames: trainer_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_trainer_client_trainer
            onDelete: RESTRICT

        - addForeignKeyConstraint:
            baseTableName: trainer_client
            baseColumnNames: client_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_trainer_client_client
            onDelete: RESTRICT

        - addUniqueConstraint:
            tableName: trainer_client
            columnNames: trainer_id, client_id
            constraintName: uk_trainer_client_trainer_client