databaseChangeLog:
  - changeSet:
      id: 007-create-exercise-template
      author: ivan
      changes:
        - createTable:
            tableName: exercise_template
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_exercise_template
                    nullable: false
              - column:
                  name: trainer_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(2000)
              - column:
                  name: sets
                  type: int
              - column:
                  name: reps
                  type: int
              - column:
                  name: duration_seconds
                  type: int
              - column:
                  name: rest_seconds
                  type: int
              - column:
                  name: trainer_note
                  type: varchar(2000)
              - column:
                  name: is_archived
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: exercise_template
            baseColumnNames: trainer_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_exercise_template_trainer
            onDelete: CASCADE

        - createIndex:
            tableName: exercise_template
            indexName: idx_exercise_template_trainer_archived
            columns:
              - column:
                  name: trainer_id
              - column:
                  name: is_archived

        - createIndex:
            tableName: exercise_template
            indexName: idx_exercise_template_trainer_name
            columns:
              - column:
                  name: trainer_id
              - column:
                  name: name