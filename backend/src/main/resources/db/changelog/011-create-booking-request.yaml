databaseChangeLog:
  - changeSet:
      id: 011-create-booking-request
      author: openai
      changes:
        - createTable:
            tableName: booking_request
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_booking_request
                    nullable: false
              - column:
                  name: trainer_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: client_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: requested_start
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: requested_end
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: client_comment
                  type: varchar(2000)
              - column:
                  name: trainer_comment
                  type: varchar(2000)
              - column:
                  name: reviewed_at
                  type: timestamp
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: booking_request
            baseColumnNames: trainer_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_booking_request_trainer
            onDelete: RESTRICT

        - addForeignKeyConstraint:
            baseTableName: booking_request
            baseColumnNames: client_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_booking_request_client
            onDelete: RESTRICT

        - createIndex:
            tableName: booking_request
            indexName: idx_booking_request_trainer_start
            columns:
              - column:
                  name: trainer_id
              - column:
                  name: requested_start

        - createIndex:
            tableName: booking_request
            indexName: idx_booking_request_client_status
            columns:
              - column:
                  name: client_id
              - column:
                  name: status

        - createIndex:
            tableName: booking_request
            indexName: idx_booking_request_trainer_status
            columns:
              - column:
                  name: trainer_id
              - column:
                  name: status
