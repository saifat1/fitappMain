databaseChangeLog:
  - changeSet:
      id: 038-create-training-exercise-field
      author: claude
      changes:
        - createTable:
            tableName: training_exercise_field
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_training_exercise_field
                    nullable: false

              - column:
                  name: training_exercise_id
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: position
                  type: int
                  constraints:
                    nullable: false

              - column:
                  name: field_type
                  type: varchar(16)
                  constraints:
                    nullable: false

              - column:
                  name: text_value
                  type: varchar(2000)

              - column:
                  name: seconds
                  type: int

        - addForeignKeyConstraint:
            baseTableName: training_exercise_field
            baseColumnNames: training_exercise_id
            referencedTableName: training_exercise
            referencedColumnNames: id
            constraintName: fk_training_exercise_field_exercise
            onDelete: CASCADE

        - createIndex:
            tableName: training_exercise_field
            indexName: idx_training_exercise_field_exercise
            columns:
              - column:
                  name: training_exercise_id
