databaseChangeLog:
  - changeSet:
      id: 022-create-user-consent
      author: ivan
      changes:
        - createTable:
            tableName: user_consent
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_user_consent
                    nullable: false

              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: consent_type
                  type: varchar(100)
                  constraints:
                    nullable: false

              - column:
                  name: document_version
                  type: varchar(50)
                  constraints:
                    nullable: false

              - column:
                  name: accepted_at
                  type: timestamp
                  constraints:
                    nullable: false

              - column:
                  name: revoked_at
                  type: timestamp

              - column:
                  name: ip_address
                  type: varchar(100)

              - column:
                  name: user_agent
                  type: text

        - addForeignKeyConstraint:
            baseTableName: user_consent
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_user_consent_user
            onDelete: CASCADE

        - createIndex:
            tableName: user_consent
            indexName: idx_user_consent_user_id
            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: user_consent
            indexName: idx_user_consent_user_type_version
            columns:
              - column:
                  name: user_id
              - column:
                  name: consent_type
              - column:
                  name: document_version