databaseChangeLog:
  - changeSet:
      id: 012-create-trainer-availability-exception
      author: ivan
      changes:
        - createTable:
            tableName: trainer_availability_exception
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_trainer_availability_exception
                    nullable: false
              - column:
                  name: trainer_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: exception_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: start_time
                  type: time
                  constraints:
                    nullable: false
              - column:
                  name: end_time
                  type: time
                  constraints:
                    nullable: false
              - column:
                  name: comment
                  type: varchar(500)
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: trainer_availability_exception
            baseColumnNames: trainer_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_trainer_availability_exception_trainer
            onDelete: RESTRICT

        - createIndex:
            tableName: trainer_availability_exception
            indexName: idx_trainer_availability_exception_trainer_date
            columns:
              - column:
                  name: trainer_id
              - column:
                  name: exception_date