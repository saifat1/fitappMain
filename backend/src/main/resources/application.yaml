app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:dev-secret}
    expiration-ms: 86400000
    public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:3000}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@fitapp.local}
  password-reset:
    expiration-minutes: ${PASSWORD_RESET_EXP_MIN:60}
spring:
  application:
    name: fitapp-backend
  mail:
    host: ${MAIL_HOST:smtp.yandex.ru}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: ${MAIL_SSL:true}
          starttls:
            enable: ${MAIL_STARTTLS:false}
storage:
  uploads-dir: uploads

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fitapp}
    username: ${SPRING_DATASOURCE_USERNAME:fituser}
    password: ${SPRING_DATASOURCE_PASSWORD:fitpass}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${SERVER_PORT:8080}