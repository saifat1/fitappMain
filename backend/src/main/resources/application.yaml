app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:3000}
  cors:
    extra-origins: ${APP_EXTRA_ORIGINS:}
  jwt:
    secret: ${JWT_SECRET:dev-secret}
    expiration-ms: 86400000
    public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:3000}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@fitapp.local}
  push:
    enabled: ${PUSH_ENABLED:false}
    vapid:
      public-key: ${PUSH_VAPID_PUBLIC_KEY:}
      private-key: ${PUSH_VAPID_PRIVATE_KEY:}
      subject: ${PUSH_VAPID_SUBJECT:mailto:no-reply@fitapp.com.ru}
  password-reset:
    expiration-minutes: ${PASSWORD_RESET_EXP_MIN:60}
  billing:
    # Off: no limits, «Подписка» shows "скоро". Turn on together with a real provider —
    # every trainer then gets a 14-day Pro trial from their first visit.
    enabled: ${BILLING_ENABLED:false}
    # "test" — our own fake payment page (dev stand only); real providers get their own codes.
    provider: ${BILLING_PROVIDER:test}
  # BILLING_PROVIDER=robokassa. Passwords #1/#2 from the shop's technical settings; with ROBOKASSA_TEST=true
  # put the *test* passwords here. Hash must match the algorithm chosen in the shop settings.
  robokassa:
    login: ${ROBOKASSA_LOGIN:}
    password1: ${ROBOKASSA_PASSWORD1:}
    password2: ${ROBOKASSA_PASSWORD2:}
    test: ${ROBOKASSA_TEST:true}
    hash: ${ROBOKASSA_HASH:md5}
    # Send the Receipt line item (fiscalization); off until checked against the shop's receipt settings.
    receipt: ${ROBOKASSA_RECEIPT:false}
  # Seller details for the public «Тарифы» page and the offer (required by the payment provider).
  # Set on the server only — they are not kept in the repository.
  seller:
    name: ${SELLER_NAME:}
    inn: ${SELLER_INN:}
    email: ${SELLER_EMAIL:}
    phone: ${SELLER_PHONE:}
    city: ${SELLER_CITY:}
spring:
  application:
    name: fitapp-backend
  mail:
    host: ${MAIL_HOST:smtp.yandex.ru}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: ${MAIL_SSL:true}
          starttls:
            enable: ${MAIL_STARTTLS:false}
storage:
  uploads-dir: uploads

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fitapp}
    username: ${SPRING_DATASOURCE_USERNAME:fituser}
    password: ${SPRING_DATASOURCE_PASSWORD:fitpass}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${SERVER_PORT:8080}